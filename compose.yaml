services:
  wslink.api:
    image: 192.168.88.28:5000/wslink-api:v0.2.0
    #image: wslink-api:v0.2.0
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      # Secrets and host-specific values come from the shell or a .env file next to this file.
      OpenHab__Enabled: "true"
      OpenHab__BaseUrl: ${OPENHAB_BASE_URL:?OPENHAB_BASE_URL is not set}
      OpenHab__ApiToken: ${OPENHAB_API_TOKEN:-}
      Postgres__Enabled: "true"
      Postgres__ConnectionString: "Host=postgres;Database=wslink;Username=wslink;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}"
    depends_on:
      - postgres

  postgres:
    image: timescale/timescaledb:2.32.1-pg18
    environment:
      POSTGRES_DB: wslink
      POSTGRES_USER: wslink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    expose:
      - "5432"
    volumes:
      # PostgreSQL 18+ images keep the data in a version subdirectory (PGDATA=/var/lib/postgresql/18/docker),
      # so the volume is mounted one level up; a major upgrade then does not mix data of two versions.
      - postgres_data:/var/lib/postgresql
      # Runs only when the data volume is empty (first start), an existing database is not changed.
      - ./docs/sql/timescaledb.sql:/docker-entrypoint-initdb.d/100_weather_data.sql:ro

  caddy:
    image: caddy:2
    depends_on:
      - wslink.api
    expose:
      - "4443"
    ports:
      - "4443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat >/etc/caddy/Caddyfile <<'EOF'
        192.168.88.28 {
          reverse_proxy wslink.api:8080
          tls internal
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile


volumes:
  postgres_data:
  caddy_data:
  caddy_config:
