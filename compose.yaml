services:
  wslink.api:
    image: 192.168.88.28:5000/wslink-api:v0.2.0
    #image: wslink-api:v0.2.0
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      # Secrets and host-specific values come from the shell or a .env file next to this file.
      OpenHab__Enabled: "true"
      OpenHab__BaseUrl: ${OPENHAB_BASE_URL:?OPENHAB_BASE_URL is not set}
      OpenHab__ApiToken: ${OPENHAB_API_TOKEN:-}

  caddy:
    image: caddy:2
    depends_on:
      - wslink.api
    expose:
      - "4443"
    ports:
      - "4443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat >/etc/caddy/Caddyfile <<'EOF'
        192.168.88.28 {
          reverse_proxy wslink.api:8080
          tls internal
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile


volumes:
  caddy_data:
  caddy_config:
